<!-- EcoPower shared contact modal. Loaded from /contact-modal by each page's embedded loader (contact-modal.js). -->
<div aria-hidden="true" class="modal-overlay" id="contactModal">
  <section aria-labelledby="contactTitle" aria-modal="true" class="contact-modal" id="contact" role="dialog">
    <button aria-label="Close contact form" class="modal-close" id="modalClose" type="button">×</button>
    <span class="eyebrow">Schedule your audit</span>
    <h2 id="contactTitle">Tell us about your Maryland home.</h2>
    <p>EcoPower will follow up to confirm the property, utility account, service area, audit availability, and next steps.</p>
    <form action="https://formsubmit.co/info@ecopowersol.com" method="POST">
      <input name="_subject" type="hidden" value="New EcoPower Solutions Energy Audit Request"/>
      <input name="_captcha" type="hidden" value="false"/>
      <input name="_template" type="hidden" value="table"/>
      <!-- Currently BGE-only service area. Utility dropdown hidden for now;
           remove this hidden input and restore the <select> below if/when
           other utility territories are added. -->
      <input name="utility" type="hidden" value="BGE"/>
      <div class="form-grid">
        <div class="form-group">
          <label for="firstName">First name *</label>
          <input autocomplete="given-name" id="firstName" name="firstName" required="" type="text"/>
        </div>
        <div class="form-group">
          <label for="lastName">Last name *</label>
          <input autocomplete="family-name" id="lastName" name="lastName" required="" type="text"/>
        </div>
        <div class="form-group">
          <label for="email">Email address *</label>
          <input autocomplete="email" id="email" name="email" required="" type="email"/>
        </div>
        <div class="form-group">
          <label for="phone">Phone number *</label>
          <input autocomplete="tel" id="phone" name="phone" required="" type="tel"/>
        </div>
        <div class="form-group form-group-full">
          <label for="address">Property address *</label>
          <input autocomplete="street-address" id="address" name="address" required="" type="text"/>
        </div>
        <!--
        Utility select — hidden for now since we only service BGE customers.
        To bring it back: delete the hidden "utility" input above and
        uncomment this block.

        <div class="form-group">
          <label for="utility">Utility</label>
          <select id="utility" name="utility">
            <option value="">Select utility</option>
            <option value="BGE">BGE</option>
            <option value="Pepco">Pepco</option>
            <option value="Potomac Edison">Potomac Edison</option>
            <option value="Delmarva Power">Delmarva Power</option>
            <option value="SMECO">SMECO</option>
            <option value="Other / Unsure">Other / Unsure</option>
          </select>
        </div>
        -->
        <div class="form-group">
          <label for="interest">Primary interest</label>
          <select id="interest" name="interest">
            <option value="Home energy audit">Home energy audit</option>
            <option value="Rebates and insulation">Rebates and insulation</option>
            <option value="Air sealing">Air sealing</option>
            <option value="Heat pump HVAC">Heat pump HVAC</option>
            <option value="Heat pump water heater">Heat pump water heater</option>
            <option value="Weatherization">Weatherization</option>
            <option value="Commercial HVAC tune-up">Commercial HVAC tune-up</option>
          </select>
        </div>
        <div class="form-group form-group-full">
          <label for="message">How can we help? *</label>
          <textarea id="message" name="message" placeholder="Tell us about comfort problems, high bills, planned upgrades, or the rebates you want to explore." required=""></textarea>
        </div>
      </div>
      <div class="form-submit">
        <p class="form-note">Submitting this form does not guarantee program or rebate eligibility. EcoPower will verify the applicable pathway with you.</p>
        <button class="btn btn-primary" type="submit">Request Your Audit</button>
      </div>
    </form>
  </section>
</div>
